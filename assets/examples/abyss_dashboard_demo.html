<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>苍渊 — 运行监控示例</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans SC",system-ui,sans-serif;background:var(--bg-primary);color:var(--text-primary)}.shell{max-width:1500px;margin:auto;padding:42px}.eyebrow{font-size:11px;letter-spacing:2.6px;color:var(--accent-muted)}h1{font-size:38px;margin:10px 0 8px;font-weight:580}.sub{color:var(--text-secondary);margin:0 0 34px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:24px}.panel h2{font-size:16px;margin:0 0 18px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:26px 0}.metric{padding:20px 0}.metric+.metric{border-left:1px solid var(--border);padding-left:24px}.metric span{display:block;color:var(--text-secondary);font-size:12px}.metric strong{display:block;margin-top:8px;font-size:28px;font-weight:520}.chart{height:300px;position:relative;background:linear-gradient(to bottom,transparent,rgba(96,125,153,.08));overflow:hidden}.chart:before,.chart:after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--border);opacity:.45}.chart:before{top:33%}.chart:after{top:66%}.curve{position:absolute;left:4%;right:4%;bottom:22%;height:120px;border-bottom:3px solid var(--accent);border-radius:0 0 50% 50%;transform:skewY(-6deg);filter:drop-shadow(0 0 6px rgba(159,196,226,.18))}.curve2{bottom:10%;height:90px;border-bottom-color:var(--accent-muted);opacity:.85}.logs{display:grid;gap:0}.log{display:grid;grid-template-columns:86px 1fr auto;padding:15px 0;border-bottom:1px solid var(--border);font-size:13px}.log time,.log .kind{color:var(--text-tertiary)}.ok{color:var(--accent)}button{border:0;background:var(--accent);color:var(--on-accent);height:40px;border-radius:8px;padding:0 16px;font-weight:600}.head{display:flex;justify-content:space-between;align-items:flex-end}@media(max-width:900px){.shell{padding:24px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.metric:nth-child(3){border-left:0}.metric{padding-left:0!important;border-bottom:1px solid var(--border)}}
</style>
</head>
<body data-theme="abyssus">
<div class="shell">
  <div class="head"><div><div class="eyebrow">ABYSSUS · RUNTIME OBSERVATORY</div><h1>训练运行监控</h1><p class="sub">蓝光只标记已被识别、确认或需要行动的信息。</p></div><button>打开实时日志</button></div>
  <div class="metrics"><div class="metric"><span>GPU 利用率</span><strong>93%</strong></div><div class="metric"><span>显存</span><strong>36.8 GB</strong></div><div class="metric"><span>Loss</span><strong class="ok">1.842</strong></div><div class="metric"><span>Step</span><strong>18,420</strong></div></div>
  <div class="grid"><section class="panel"><h2>Loss trajectory</h2><div class="chart"><div class="curve"></div><div class="curve curve2"></div></div></section><section class="panel"><h2>Recent signals</h2><div class="logs"><div class="log"><time>21:42:18</time><span>Checkpoint saved</span><span class="ok">CONFIRMED</span></div><div class="log"><time>21:41:54</time><span>Validation window completed</span><span class="kind">INFO</span></div><div class="log"><time>21:39:22</time><span>GPU temperature stable</span><span class="kind">NORMAL</span></div><div class="log"><time>21:36:09</time><span>Dataset shard 18 loaded</span><span class="kind">INFO</span></div></div></section></div>
</div>
</body>
</html>
