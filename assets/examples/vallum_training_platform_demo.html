<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>苍渊·白垣 — 训练工作空间示例</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg-primary);color:var(--text-primary);font-size:14px}.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{background:var(--bg-secondary);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column}.brand{font-weight:700;font-size:25px;letter-spacing:-.6px;padding:0 12px 26px}.brand small{display:block;font-size:10px;font-weight:500;letter-spacing:1.8px;color:var(--text-tertiary);margin-top:5px}.group{font-size:12px;color:var(--text-tertiary);padding:18px 12px 8px}.nav{height:40px;border-radius:8px;padding:0 12px;display:flex;align-items:center;gap:10px;color:var(--text-secondary);margin:2px 0}.nav.active{background:var(--selected);color:var(--text-primary);font-weight:600}.nav:hover{background:var(--hover)}.dot{width:7px;height:7px;border:1px solid currentColor;border-radius:2px}.sidebar-foot{margin-top:auto;border-top:1px solid var(--border);padding:16px 12px 0;color:var(--text-secondary);font-size:12px}.main{padding:0 40px 50px}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);color:var(--text-secondary)}.crumb{display:flex;gap:10px}.status{display:flex;align-items:center;gap:9px}.status i{display:block;width:7px;height:7px;border-radius:50%;background:var(--accent)}.header{display:flex;justify-content:space-between;align-items:flex-start;padding:36px 0 26px}.title h1{font-size:30px;margin:0 0 8px;font-weight:650;letter-spacing:-.5px}.title p{margin:0;color:var(--text-secondary)}button,input{font:inherit}.primary{height:40px;border:0;border-radius:8px;padding:0 16px;background:var(--text-primary);color:var(--bg-primary);cursor:pointer}.primary:hover{opacity:.88}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 0 14px;border-bottom:1px solid var(--border)}.count{color:var(--text-secondary)}.search{width:260px;height:40px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--text-primary);padding:0 12px;outline:none}.search:focus{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 24%,transparent)}.row{display:grid;grid-template-columns:minmax(420px,1fr) 120px 180px 28px;align-items:center;min-height:104px;border-bottom:1px solid var(--border);padding:0 16px 0 12px;transition:background var(--av-transition)}.row:hover{background:var(--hover)}.project{display:flex;align-items:center;gap:16px}.folder{width:20px;height:16px;border:1.5px solid var(--text-secondary);border-radius:3px;position:relative}.folder:before{content:"";position:absolute;left:2px;top:-5px;width:8px;height:5px;border:1.5px solid var(--text-secondary);border-bottom:0;border-radius:3px 3px 0 0}.name{font-size:16px;font-weight:600;margin-bottom:5px}.meta{color:var(--text-secondary)}.metric strong{font-size:17px;display:block}.metric span{font-size:12px;color:var(--text-tertiary);display:block;margin-top:8px}.arrow{font-size:22px;color:var(--text-secondary)}@media(max-width:900px){.app{grid-template-columns:80px 1fr}.brand{font-size:0}.brand:before{content:"AV";font-size:18px}.brand small,.group,.nav span,.sidebar-foot{display:none}.nav{justify-content:center}.main{padding:0 20px}.row{grid-template-columns:1fr 80px 24px}.row .metric:nth-of-type(2){display:none}}
</style>
</head>
<body data-theme="vallum">
<div class="app">
<aside class="sidebar">
  <div class="brand">ninna.<small>ABYSSUS · VALLUM</small></div>
  <div class="group">工作台</div>
  <div class="nav active"><i class="dot"></i><span>项目</span></div>
  <div class="nav"><i class="dot"></i><span>中心存储</span></div>
  <div class="group">训练定义</div>
  <div class="nav"><i class="dot"></i><span>数据集</span></div>
  <div class="nav"><i class="dot"></i><span>模型</span></div>
  <div class="nav"><i class="dot"></i><span>训练配方</span></div>
  <div class="group">执行环境</div>
  <div class="nav"><i class="dot"></i><span>镜像资产</span></div>
  <div class="nav"><i class="dot"></i><span>运行环境</span></div>
  <div class="nav"><i class="dot"></i><span>代码空间</span></div>
  <div class="sidebar-foot">Docker · 已连接<br/>执行 · CPU</div>
</aside>
<main class="main">
  <div class="topbar"><div class="crumb">Ninna <span>›</span> 训练工作空间</div><div class="status"><i></i> 本地执行&nbsp;&nbsp;|&nbsp;&nbsp;Docker Engine</div></div>
  <div class="header"><div class="title"><h1>项目</h1><p>围绕一个训练目标，组织运行与实验。</p></div><button class="primary">＋ 新建项目</button></div>
  <div class="toolbar"><div class="count">6 个项目</div><input class="search" placeholder="搜索项目" /></div>
  <section>
    <div class="row"><div class="project"><i class="folder"></i><div><div class="name">ui-project-1790349578427</div><div class="meta">Project 浏览器回归</div></div></div><div class="metric"><strong>0</strong><span>次运行</span></div><div class="metric"><span>最近运行</span><div class="meta">暂无运行</div></div><div class="arrow">→</div></div>
    <div class="row"><div class="project"><i class="folder"></i><div><div class="name">mnist-tests</div><div class="meta">开发回归测试</div></div></div><div class="metric"><strong>11</strong><span>次运行</span></div><div class="metric"><span>最近运行</span><div class="meta">09/25 23:24</div></div><div class="arrow">→</div></div>
    <div class="row"><div class="project"><i class="folder"></i><div><div class="name">legacy</div><div class="meta">历史训练</div></div></div><div class="metric"><strong>57</strong><span>次运行</span></div><div class="metric"><span>最近运行</span><div class="meta">09/25 23:20</div></div><div class="arrow">→</div></div>
  </section>
</main>
</div>
</body>
</html>
